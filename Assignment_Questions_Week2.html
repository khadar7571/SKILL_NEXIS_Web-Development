<!DOCTYPE html>
<html>
<head>
    <title>Interactive Image Gallery</title>

    <style>
        /* Assignment 1: Interactive Image Gallery */

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: lightgray;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        /* Show 6–8 images in a grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        /* Add hover animations */
        .gallery img:hover {
            transform: scale(1.08);
        }

        /* Lightbox view */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>Interactive Image Gallery</h1>

    <!-- Show 6–8 images in a grid -->
    <div class="gallery">
        <img src="https://picsum.photos/id/1015/600/400" onclick="openImage(this.src)">
        <img src="https://picsum.photos/id/1016/600/400" onclick="openImage(this.src)">
        <img src="https://picsum.photos/id/1018/600/400" onclick="openImage(this.src)">
        <img src="https://picsum.photos/id/1020/600/400" onclick="openImage(this.src)">
        <img src="https://picsum.photos/id/1024/600/400" onclick="openImage(this.src)">
        <img src="https://picsum.photos/id/1025/600/400" onclick="openImage(this.src)">
        <img src="https://picsum.photos/id/1035/600/400" onclick="openImage(this.src)">
        <img src="https://picsum.photos/id/1039/600/400" onclick="openImage(this.src)">
    </div>

    <!-- Lightbox view -->
    <div class="lightbox" id="lightbox">
        <span class="close" onclick="closeImage()">&times;</span>
        <img id="largeImage">
    </div>

    <script>
        // Open image in lightbox
        function openImage(imageSrc) {
            document.getElementById("largeImage").src = imageSrc;
            document.getElementById("lightbox").style.display = "flex";
        }

        // Close lightbox
        function closeImage() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>

</body>
</html>
