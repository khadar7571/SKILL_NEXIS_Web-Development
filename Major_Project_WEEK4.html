<!DOCTYPE html>
<html>
<head>

    <title>Student Management Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
            transition: 0.3s;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin: 5px 0;
            font-size: 30px;
        }

        .card p {
            margin: 0;
            color: #666;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-box h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .clear-btn {
            background: #dc2626;
            color: white;
        }

        .export-btn {
            background: #16a34a;
            color: white;
        }

        .dark-btn {
            background: #111827;
            color: white;
        }

        .controls {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 10px;
        }

        .table-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1f2937;
            color: white;
        }

        tr:hover {
            background: #f1f5f9;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .inactive {
            color: red;
            font-weight: bold;
        }

        .no-data {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        body.dark {
            background: #111827;
            color: white;
        }

        body.dark .card,
        body.dark .form-box,
        body.dark .controls,
        body.dark .table-box {
            background: #1f2937;
            color: white;
        }

        body.dark input,
        body.dark select {
            background: #374151;
            color: white;
            border-color: #555;
        }

        body.dark tr:hover {
            background: #374151;
        }

        @media(max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>Student Management Dashboard</h1>

        <p>Manage student records easily</p>

        <button class="dark-btn" onclick="toggleDarkMode()">
            Dark Mode
        </button>

    </div>


    <div class="container">


        <!-- Dashboard Statistics -->

        <div class="stats">

            <div class="card">
                <p>Total Students</p>
                <h2 id="totalStudents">0</h2>
            </div>

            <div class="card">
                <p>Active Students</p>
                <h2 id="activeStudents">0</h2>
            </div>

            <div class="card">
                <p>Inactive Students</p>
                <h2 id="inactiveStudents">0</h2>
            </div>

            <div class="card">
                <p>Total Courses</p>
                <h2 id="totalCourses">0</h2>
            </div>

        </div>


        <!-- Student Form -->

        <div class="form-box">

            <h2 id="formTitle">Add Student</h2>

            <div class="form-grid">

                <input
                    type="text"
                    id="name"
                    placeholder="Student Name">

                <input
                    type="number"
                    id="age"
                    placeholder="Age">

                <select id="gender">

                    <option value="">Select Gender</option>

                    <option value="Male">Male</option>

                    <option value="Female">Female</option>

                    <option value="Other">Other</option>

                </select>

                <input
                    type="email"
                    id="email"
                    placeholder="Email">

                <input
                    type="text"
                    id="phone"
                    placeholder="Phone Number">

                <select id="course">

                    <option value="">Select Course</option>

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Information Technology">
                        Information Technology
                    </option>

                    <option value="Data Science">
                        Data Science
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Mechanical">
                        Mechanical
                    </option>

                </select>

                <select id="year">

                    <option value="">Select Year</option>

                    <option value="1st Year">1st Year</option>

                    <option value="2nd Year">2nd Year</option>

                    <option value="3rd Year">3rd Year</option>

                    <option value="4th Year">4th Year</option>

                </select>

                <select id="status">

                    <option value="Active">Active</option>

                    <option value="Inactive">Inactive</option>

                </select>

            </div>

            <br>

            <button
                class="add-btn"
                onclick="saveStudent()"
                id="saveButton">

                Add Student

            </button>

            <button
                class="clear-btn"
                onclick="clearForm()">

                Clear

            </button>

        </div>


        <!-- Search and Filters -->

        <div class="controls">

            <input
                type="text"
                id="search"
                placeholder="Search by name, ID, email or course..."
                onkeyup="applyFilters()">

            <select id="courseFilter"
                    onchange="applyFilters()">

                <option value="">All Courses</option>

                <option value="Computer Science">
                    Computer Science
                </option>

                <option value="Information Technology">
                    Information Technology
                </option>

                <option value="Data Science">
                    Data Science
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Mechanical">
                    Mechanical
                </option>

            </select>

            <select id="statusFilter"
                    onchange="applyFilters()">

                <option value="">All Status</option>

                <option value="Active">Active</option>

                <option value="Inactive">Inactive</option>

            </select>

            <select id="sortFilter"
                    onchange="applyFilters()">

                <option value="">Sort By</option>

                <option value="name">
                    Name
                </option>

                <option value="age">
                    Age
                </option>

                <option value="course">
                    Course
                </option>

            </select>

        </div>


        <!-- Buttons -->

        <div>

            <button
                class="export-btn"
                onclick="exportCSV()">

                Export CSV

            </button>

            <button
                class="clear-btn"
                onclick="deleteAllStudents()">

                Delete All

            </button>

        </div>


        <!-- Student Table -->

        <div class="table-box">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Age</th>

                        <th>Gender</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Course</th>

                        <th>Year</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </div>


<script>


    // Store students in localStorage

    let students =
        JSON.parse(localStorage.getItem("students")) || [];


    // Variable used when editing

    let editIndex = -1;


    // Generate Student ID

    function generateID() {

        return "STU" +
            String(students.length + 1).padStart(3, "0");

    }


    // Save Student

    function saveStudent() {

        let name =
            document.getElementById("name").value.trim();

        let age =
            document.getElementById("age").value;

        let gender =
            document.getElementById("gender").value;

        let email =
            document.getElementById("email").value.trim();

        let phone =
            document.getElementById("phone").value.trim();

        let course =
            document.getElementById("course").value;

        let year =
            document.getElementById("year").value;

        let status =
            document.getElementById("status").value;


        // Form validation

        if (
            name === "" ||
            age === "" ||
            gender === "" ||
            email === "" ||
            phone === "" ||
            course === "" ||
            year === ""
        ) {

            alert("Please fill all fields.");

            return;
        }


        if (age < 15 || age > 60) {

            alert("Please enter a valid age.");

            return;
        }


        let student = {

            id:
                editIndex === -1
                    ? generateID()
                    : students[editIndex].id,

            name: name,

            age: age,

            gender: gender,

            email: email,

            phone: phone,

            course: course,

            year: year,

            status: status

        };


        // Add new student

        if (editIndex === -1) {

            students.push(student);

        }

        // Update existing student

        else {

            students[editIndex] = student;

            editIndex = -1;

            document.getElementById("formTitle")
                .innerText = "Add Student";

            document.getElementById("saveButton")
                .innerText = "Add Student";
        }


        // Save data

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );


        clearForm();

        displayStudents();

        updateDashboard();

    }


    // Display Students

    function displayStudents(list = students) {

        let table =
            document.getElementById("studentTable");

        table.innerHTML = "";


        if (list.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="10" class="no-data">
                        No students found
                    </td>
                </tr>
            `;

            return;
        }


        list.forEach((student) => {

            let originalIndex =
                students.findIndex(
                    s => s.id === student.id
                );


            table.innerHTML += `

                <tr>

                    <td>${student.id}</td>

                    <td>${student.name}</td>

                    <td>${student.age}</td>

                    <td>${student.gender}</td>

                    <td>${student.email}</td>

                    <td>${student.phone}</td>

                    <td>${student.course}</td>

                    <td>${student.year}</td>

                    <td class="${student.status === "Active"
                        ? "active"
                        : "inactive"}">

                        ${student.status}

                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editStudent(${originalIndex})">

                            Edit

                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${originalIndex})">

                            Delete

                        </button>

                    </td>

                </tr>

            `;

        });

    }


    // Edit Student

    function editStudent(index) {

        let student = students[index];


        document.getElementById("name").value =
            student.name;

        document.getElementById("age").value =
            student.age;

        document.getElementById("gender").value =
            student.gender;

        document.getElementById("email").value =
            student.email;

        document.getElementById("phone").value =
            student.phone;

        document.getElementById("course").value =
            student.course;

        document.getElementById("year").value =
            student.year;

        document.getElementById("status").value =
            student.status;


        editIndex = index;


        document.getElementById("formTitle")
            .innerText = "Edit Student";

        document.getElementById("saveButton")
            .innerText = "Update Student";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // Delete Student

    function deleteStudent(index) {

        let result =
            confirm(
                "Are you sure you want to delete this student?"
            );


        if (result) {

            students.splice(index, 1);

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

            displayStudents();

            updateDashboard();

        }

    }


    // Search and Filter

    function applyFilters() {

        let search =
            document.getElementById("search")
                .value
                .toLowerCase();

        let course =
            document.getElementById("courseFilter")
                .value;

        let status =
            document.getElementById("statusFilter")
                .value;

        let sort =
            document.getElementById("sortFilter")
                .value;


        let filtered =
            students.filter(student =>

                (
                    student.name.toLowerCase()
                        .includes(search) ||

                    student.id.toLowerCase()
                        .includes(search) ||

                    student.email.toLowerCase()
                        .includes(search) ||

                    student.course.toLowerCase()
                        .includes(search)
                )

                &&

                (
                    course === "" ||
                    student.course === course
                )

                &&

                (
                    status === "" ||
                    student.status === status
                )

            );


        // Sorting

        if (sort === "name") {

            filtered.sort(
                (a, b) =>
                    a.name.localeCompare(b.name)
            );

        }

        else if (sort === "age") {

            filtered.sort(
                (a, b) =>
                    Number(a.age) - Number(b.age)
            );

        }

        else if (sort === "course") {

            filtered.sort(
                (a, b) =>
                    a.course.localeCompare(b.course)
            );

        }


        displayStudents(filtered);

    }


    // Clear Form

    function clearForm() {

        document.getElementById("name").value = "";

        document.getElementById("age").value = "";

        document.getElementById("gender").value = "";

        document.getElementById("email").value = "";

        document.getElementById("phone").value = "";

        document.getElementById("course").value = "";

        document.getElementById("year").value = "";

        document.getElementById("status").value =
            "Active";

        editIndex = -1;

        document.getElementById("formTitle")
            .innerText = "Add Student";

        document.getElementById("saveButton")
            .innerText = "Add Student";

    }


    // Update Dashboard Statistics

    function updateDashboard() {

        document.getElementById("totalStudents")
            .innerText = students.length;


        let active =
            students.filter(
                student =>
                    student.status === "Active"
            ).length;


        let inactive =
            students.filter(
                student =>
                    student.status === "Inactive"
            ).length;


        let courses =
            new Set(
                students.map(
                    student => student.course
                )
            ).size;


        document.getElementById("activeStudents")
            .innerText = active;


        document.getElementById("inactiveStudents")
            .innerText = inactive;


        document.getElementById("totalCourses")
            .innerText = courses;

    }


    // Delete All Students

    function deleteAllStudents() {

        if (students.length === 0) {

            alert("There are no students to delete.");

            return;
        }


        let result =
            confirm(
                "Are you sure you want to delete ALL students?"
            );


        if (result) {

            students = [];

            localStorage.removeItem("students");

            displayStudents();

            updateDashboard();

        }

    }


    // Export Data to CSV

    function exportCSV() {

        if (students.length === 0) {

            alert("No student data to export.");

            return;
        }


        let csv =
            "ID,Name,Age,Gender,Email,Phone,Course,Year,Status\n";


        students.forEach(student => {

            csv +=
                `${student.id},` +
                `"${student.name}",` +
                `${student.age},` +
                `${student.gender},` +
                `"${student.email}",` +
                `${student.phone},` +
                `"${student.course}",` +
                `${student.year},` +
                `${student.status}\n`;

        });


        let blob =
            new Blob(
                [csv],
                { type: "text/csv" }
            );


        let url =
            URL.createObjectURL(blob);


        let link =
            document.createElement("a");


        link.href = url;

        link.download =
            "student_data.csv";


        link.click();

        URL.revokeObjectURL(url);

    }


    // Dark Mode

    function toggleDarkMode() {

        document.body.classList.toggle("dark");

    }


    // Load students when page opens

    displayStudents();

    updateDashboard();

</script>

</body>
</html>
